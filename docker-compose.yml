version: '3.8'

services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://jibas_user:secure_pass@db:5432/jibas_db
      - SECRET_KEY=${SECRET_KEY:-dev-secret}
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret}
      - REDIS_URL=redis://cache:6379/0
    depends_on:
      - db
      - cache
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=jibas_db
      - POSTGRES_USER=jibas_user
      - POSTGRES_PASSWORD=secure_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  worker:
    build: .
    command: celery -A app.tasks.cleanup worker --loglevel=info
    depends_on:
      - db
      - cache

volumes:
  pgdata:
